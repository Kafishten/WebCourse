<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/main.css">
    <title>Notes</title>
</head>

<body>
    <header class="main-header">
        <div class="header-div">
            <h1>Notes</h1>
            <nav class="nav">
                <ul class="navigation-list">
                    <li class="navigation-item">
                        <a class="navigation-link is-current" href="#">View notes</a>
                    </li>
                    <li class="navigation-item">
                        <a class="navigation-link" href="tags.html">Edit tags</a>
                    </li>
                    <li class="navigation-item">
                        <a class="navigation-link" href="backup.html">Backups</a>
                    </li>
                </ul>
            </nav>
            <button class="refresh-button">refresh</button>
        </div>
    </header>

    <div class="filtring-div">
        <h2 class="filter-info">
            Filtring by:
        </h2>
        
        <!-- ОШИБКА ФОРМАТЕРА БЫЛА ЗДЕСЬ (ТЕПЕРЬ ИСПРАВЛЕНО) -->
        <div class="filter-input-div">
            <input type="text" id="filters" maxlength="50" class="filter_input">
            <button class="filter-button">
                <svg class="clear-icon" viewBox="0 0 64 64">
                    <title/>
                    <g id="Plus">
                        <path d="M48,31H33V16a1,1,0,0,0-2,0V31H16a1,1,0,0,0,0,2H31V48a1,1,0,0,0,2,0V33H48a1,1,0,0,0,0-2Z"/>
                    </g>
                </svg>
            </button>
        </div>

        <div class="filtring-button-div">
            <button class="filtring-button" id="filter-include">include</button>
            <button class="filtring-button" id="filter-type">type</button>
            <button class="filtring-button" id="filter-tag">tag</button>
            <button class="filtring-button" id="filter-create">create</button>
            <button class="filtring-button" id="filter-change">change</button>
        </div>
    </div> <!-- ЭТОТ ТЕГ БЫЛ УДАЛЕН ФОРМАТЕРОМ. Я ВЕРНУЛ ЕГО. -->

    <div class="central-div">
        <main class="main">
            <button class="add-new-note">
                <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <title/>
                    <g id="Plus">
                        <path d="M32,2A30,30,0,1,0,62,32,30.034,30.034,0,0,0,32,2Zm0,58A28,28,0,1,1,60,32,28.0314,28.0314,0,0,1,32,60Z"/>
                        <path d="M48,31H33V16a1,1,0,0,0-2,0V31H16a1,1,0,0,0,0,2H31V48a1,1,0,0,0,2,0V33H48a1,1,0,0,0,0-2Z"/>
                    </g>
                </svg>
            </button>

            <div id="note-space">
            </div>
        </main>
        
    </div>

    <footer class="main-footer">
    </footer>
    
    <script type="module" src="assets/scripts/js/src/script.js"></script>

    <dialog id="note-dialog">
        <div class="header-dialog">
            <div>
                <label for="input-name">Name: </label>
                <input type="text" id="input-name" maxlength="22" class="input">
            </div>
            <button class="close-button" id="close-dialog">
                <svg class="icon close-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <title/>
                    <g id="Plus">
                        <path d="M32,2A30,30,0,1,0,62,32,30.034,30.034,0,0,0,32,2Zm0,58A28,28,0,1,1,60,32,28.0314,28.0314,0,0,1,32,60Z"/>
                        <path d="M48,31H33V16a1,1,0,0,0-2,0V31H16a1,1,0,0,0,0,2H31V48a1,1,0,0,0,2,0V33H48a1,1,0,0,0,0-2Z"/>
                    </g>
                </svg>
            </button>
        </div>
        
        <div class="horizontal_container">
            <button id="tag-button" class="type-button">Open tags</button>
            <div id="tag-list" class="hidden"></div>
        </div>
        
        <ul class="type-list">
            <li class="type-item">
                <button class="type-button" id="type-text-button">text</button>
            </li>
            <li class="type-item">
                <button class="type-button" id="type-top-button">top</button>
            </li>
            <li class="type-item">
                <button class="type-button" id="type-table-button">table</button>
            </li>
        </ul>
        
        <div class="note-data-input">
            <div class="hidden input-div" id="text-input-div">
                <textarea name="" id="text-input-item"></textarea>
            </div>
            
            <!-- СЮДА ВШИТ ТВОЙ НОВЫЙ ИНТЕРФЕЙС ТИР-ЛИСТОВ -->
            <div class="hidden input-div" id="top-input-div">
                <label for="default-input-card" style="margin-right: 20px;">input: </label>
                
                <div class="tier-card" draggable="true" style="margin-right: 20px;">
                    <div class="drag-handle">⋮⋮</div>
                    <div class="card-text" id="default-input-card" contenteditable="true" spellcheck="false"></div>
                </div>
                
                <div class="tiers-container" style="display: flex; column-gap: 20px; margin-block: 30px;">
                    <div class="tier-list">
                        <div class="s-tier-header some-tier-header">
                            <div class="s-tier some-tier"></div>
                        </div>
                        <div class="a-tier-header some-tier-header">
                            <div class="a-tier some-tier"></div>
                        </div>
                        <div class="b-tier-header some-tier-header">
                            <div class="b-tier some-tier"></div>
                        </div>
                        <div class="c-tier-header some-tier-header">
                            <div class="c-tier some-tier"></div>
                        </div>
                        <div class="d-tier-header some-tier-header">
                            <div class="d-tier some-tier"></div>
                        </div>
                        <div class="e-tier-header some-tier-header">
                            <div class="e-tier some-tier"></div>
                        </div>
                        <div class="f-tier-header some-tier-header">
                            <div class="f-tier some-tier"></div>
                        </div>
                    </div>
                    
                    <div class="remove-card-div">
                        <svg class="icon" width="100%" viewBox="0 0 24 24">
                            <path d="M19,6 L19,18.5 C19,19.8807119 17.8807119,21 16.5,21 L7.5,21 C6.11928813,21 5,19.8807119 5,18.5 L5,6 L4.5,6 C4.22385763,6 4,5.77614237 4,5.5 C4,5.22385763 4.22385763,5 4.5,5 L9,5 L9,4.5 C9,3.67157288 9.67157288,3 10.5,3 L13.5,3 C14.3284271,3 15,3.67157288 15,4.5 L15,5 L19.5,5 C19.7761424,5 20,5.22385763 20,5.5 C20,5.77614237 19.7761424,6 19.5,6 L19,6 Z M6,6 L6,18.5 C6,19.3284271 6.67157288,20 7.5,20 L16.5,20 C17.3284271,20 18,19.3284271 18,18.5 L18,6 L6,6 Z M14,5 L14,4.5 C14,4.22385763 13.7761424,4 13.5,4 L10.5,4 C10.2238576,4 10,4.22385763 10,4.5 L10,5 L14,5 Z M14,9.5 C14,9.22385763 14.2238576,9 14.5,9 C14.7761424,9 15,9.22385763 15,9.5 L15,16.5 C15,16.7761424 14.7761424,17 14.5,17 C14.2238576,17 14,16.7761424 14,16.5 L14,9.5 Z M9,9.5 C9,9.22385763 9.22385763,9 9.5,9 C9.77614237,9 10,9.22385763 10,9.5 L10,16.5 C10,16.7761424 9.77614237,17 9.5,17 C9.22385763,17 9,16.7761424 9,16.5 L9,9.5 Z" />
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="hidden input-div" id="table-input-div">789</div>
        </div> 
        
        <button id="submit-button" class="type-button hidden">Create</button>
    </dialog>
</body>
</html>
