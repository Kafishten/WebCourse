<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/main.css">
    
    <title>Notes</title>
</head>

<body>

    <header class="main-header">
        <div class="header-div">
            <h1>Notes</h1>
            <nav class="nav">
                <ul class="navigation-list">
                    <li class="navigation-item">
                        <a class="navigation-link is-current" href="#">View notes</a>
                        
                    </li>
                    <li class="navigation-item">
                        <a class="navigation-link" href="#">Edit filters</a>
                        
                    </li>
                    <li class="navigation-item">
                        <a class="navigation-link" href="#">Help</a>
                        
                    </li>
                </ul>
            </nav>

            <button class="refresh-button" >refresh</button>

        </div>
    </header>
        <div class="filtring-div">
        <h2 class="filter-info">
            Filtring by:
        </h2>
        <div class="filter-input-div">
            <input type="text" id="filters" maxlength="50" class="filter_input">
            <button class="filter-button">
                <svg class="clear-icon" viewBox="0 0 64 64"><title/><g id="Plus"><path d="M48,31H33V16a1,1,0,0,0-2,0V31H16a1,1,0,0,0,0,2H31V48a1,1,0,0,0,2,0V33H48a1,1,0,0,0,0-2Z"/></g></svg>
            </div>
            </button>

        <div class="filtring-button-div">
            <button class="filtring-button" id="filter-include">include</button>
            <button class="filtring-button" id="filter-type">type</button>
            <button class="filtring-button" id="filter-tag">tag</button>
            <button class="filtring-button" id="filter-create">create</button>
            <button class="filtring-button" id="filter-change">change</button>
        </div>

            
            

        </div>
    <div class="central-div">
        <main class="main" >

            <button class="add-new-note">
                <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><title/><g id="Plus"><path d="M32,2A30,30,0,1,0,62,32,30.034,30.034,0,0,0,32,2Zm0,58A28,28,0,1,1,60,32,28.0314,28.0314,0,0,1,32,60Z"/><path d="M48,31H33V16a1,1,0,0,0-2,0V31H16a1,1,0,0,0,0,2H31V48a1,1,0,0,0,2,0V33H48a1,1,0,0,0,0-2Z"/></g></svg>
            </button>

            <div id="note-space">
            
            </div>
            
            
            

        </main>
        <aside class="nav-tree">

        </aside>
    </div>
    

    <footer class="main-footer">

    </footer>
    <script type="module" src="assets/scripts/js/src/script.js"></script>

    <dialog id="note-dialog">
        <div class="header-dialog">
            <div>
                <label for="input-name">Name: </label>
                <input type="text" id="input-name" maxlength="22" class="input">
            </div>
            <button class="close-button" id="close-dialog">
                <svg class="icon close-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><title/><g id="Plus"><path d="M32,2A30,30,0,1,0,62,32,30.034,30.034,0,0,0,32,2Zm0,58A28,28,0,1,1,60,32,28.0314,28.0314,0,0,1,32,60Z"/><path d="M48,31H33V16a1,1,0,0,0-2,0V31H16a1,1,0,0,0,0,2H31V48a1,1,0,0,0,2,0V33H48a1,1,0,0,0,0-2Z"/></g></svg>
            </button>
        </div>
        <div class="horizontal_container">
            <button id="tag-button" class="type-button">Open tags</button>
            <div id="tag-list" class="hidden"></div>
        </div>
        
        
            <ul class="type-list">
                <li class="type-item">
                    <button class="type-button" id="type-text-button">
                        text
                    </button>
                </li>
                <li class="type-item">
                    <button class="type-button" id="type-top-button">
                        top
                    </button>
                </li>
                <li class="type-item">
                    <button class="type-button" id="type-table-button" >
                        table
                    </button>
                </li>
            </ul>
            <div class="note-data-input">
                <div class="hidden input-div" id="text-input-div">
                    <textarea name="" id="text-input-item"></textarea>
                </div>
                <div class="hidden input-div" id="top-input-div">456</div>
                <div class="hidden input-div" id="table-input-div">789</div>
            </div> 
            <button id="submit-button" class="type-button hidden">Create</button>
    </dialog>


</body>
</html>
